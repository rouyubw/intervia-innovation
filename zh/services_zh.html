nav { background: #111; padding: 20px 40px; border-bottom: 1px solid #222; display: flex; align-items: center; }

footer { text-align: center; padding: 40px 20px; font-size: 14px; color: #777; border-top: 1px solid #222; background: #0b0b0b; flex-shrink: 0; }

.services-row { display: flex; gap: 25px; justify-content: center; text-align: left; }
.service-column { flex: 1; max-width: 340px; display: flex; flex-direction: column; }
.service-title { font-size: 22px; font-weight: 600; color: #7dd3fc; margin-bottom: 15px; text-transform: uppercase; text-align: center; }
.service-box { background: transparent; border: 1px solid #7dd3fc; padding: 30px; border-radius: 2px; height: 100%; }
.service-box ul { margin: 0; padding-left: 18px; color: #cfcfcf; }
.service-box li { margin-bottom: 15px; font-size: 15px; line-height: 1.6; }
@media (max-width: 900px) { .services-row { flex-direction: column; align-items: center; } .service-column { max-width: 100%; width: 100%; } }
