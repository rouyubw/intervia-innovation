<style>
/* 基礎設定 */
html, body { height: 100%; margin: 0; }
body { font-family: "Inter", "Noto Sans TC", sans-serif; background: #0b0b0b; color: #eaeaea; line-height: 1.7; display: flex; flex-direction: column; }

/* 導覽列 */
nav { background: #111; padding: 20px 40px; border-bottom: 1px solid #222; display: flex; align-items: center; }
.logo { height: 80px; width: auto; margin-right: 35px; }
nav a { color: #eaeaea; text-decoration: none; margin-right: 24px; font-weight: 500; font-size: 15px; }
nav a:hover { color: #7dd3fc; }

/* 語言選單 */
.lang-menu { position: relative; display: inline-block; margin-left: auto; }
.lang-btn { background: transparent; color: #eaeaea; padding: 8px 15px; font-size: 14px; border: 1px solid #444; cursor: pointer; font-family: inherit; border-radius: 2px; }
.dropdown-content { display: none; position: absolute; right: 0; background-color: #111; min-width: 140px; border: 1px solid #222; z-index: 100; }
.dropdown-content a { color: #eaeaea; padding: 12px 16px; text-decoration: none; display: block; margin-right: 0 !important; font-size: 14px; }
.dropdown-content a:hover { background-color: #1c1c1c; color: #7dd3fc; }
.lang-menu:hover .dropdown-content { display: block; }

/* 主內容區域 */
.container { max-width: 1100px; margin: 0 auto; padding: 60px 20px; flex: 1 0 auto; }
h1 { font-size: 42px; font-weight: 700; margin-bottom: 50px; color: #fff; text-align: left; }

/* 固定兩欄佈局 */
.insights-grid { 
    display: grid; 
    grid-template-columns: 1fr 1fr; /* 嚴格固定為兩欄 */
    gap: 30px; 
}

.article-card { 
    background: #161616; 
    border: 1px solid #222; 
    padding: 40px; 
    border-radius: 4px; 
    display: flex; 
    flex-direction: column; 
    text-decoration: none; 
    color: inherit; 
    transition: all 0.3s ease; 
}

.article-card:hover { 
    border-color: #7dd3fc; 
    transform: translateY(-4px); 
    background: #1c1c1c; 
}

.article-date { 
    font-size: 12px; 
    color: #7dd3fc; 
    text-transform: uppercase; 
    letter-spacing: 1.5px; 
    margin-bottom: 15px; 
    font-weight: 600; 
}

.article-title { 
    font-size: 24px; 
    font-weight: 600; 
    margin: 0 0 20px 0; 
    color: #fff; 
    line-height: 1.3; 
}

.article-summary { 
    font-size: 16px; 
    color: #cfcfcf; 
    margin-bottom: 30px; 
    flex-grow: 1; 
}

.read-more { 
    font-size: 14px; 
    font-weight: 700; 
    color: #7dd3fc; 
}

/* 頁尾 */
footer { text-align: center; padding: 40px 20px; font-size: 14px; color: #777; border-top: 1px solid #222; background: #0b0b0b; flex-shrink: 0; }

/* 行動裝置自動轉為一欄 */
@media (max-width: 850px) {
    .insights-grid { grid-template-columns: 1fr; }
    nav { flex-direction: column; padding: 20px; text-align: center; }
    .logo { margin-right: 0; margin-bottom: 20px; }
}
</style>
</head>
<body>

</nav>
