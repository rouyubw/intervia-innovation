/* 1. STICKY FOOTER SETUP */
html, body {
    height: 100%;
    margin: 0;
}

body {
    font-family: "Inter", "Noto Sans TC", sans-serif;
    background: #0b0b0b;
    color: #eaeaea;
    line-height: 1.7;
    display: flex;
    flex-direction: column;
}

/* 2. NAVIGATION & LOGO */
nav {
    background: #111;
    padding: 20px 40px;
    border-bottom: 1px solid #222;
    display: flex;
    align-items: center;
}

.logo {
    height: 80px;
    width: auto;
    margin-right: 35px;
}

nav a {
    color: #eaeaea;
    text-decoration: none;
    margin-right: 24px;
    font-weight: 500;
    font-size: 15px;
}

nav a:hover {
    color: #7dd3fc;
}

/* 3. MAIN CONTENT */
.container {
    max-width: 1100px;
    margin: 0 auto;
    padding: 60px 20px;
    flex: 1 0 auto;
}

h1 {
    font-size: 42px;
    font-weight: 700;
    margin-bottom: 50px;
    color: #fff;
    text-align: left; /* Aligned with About page margin */
}

/* 4. INSIGHTS GRID */
.insights-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 25px;
    justify-content: center;
}

.article-card {
    background: #161616;
    border: 1px solid #222;
    padding: 30px;
    border-radius: 4px;
    display: flex;
    flex-direction: column;
    text-decoration: none;
    color: inherit;
    transition: all 0.3s ease;
}

.article-card:hover {
    border-color: #7dd3fc;
    transform: translateY(-4px);
    background: #1c1c1c;
}

.article-date {
    font-size: 12px;
    color: #7dd3fc;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 15px;
    font-weight: 600;
}

.article-title {
    font-size: 22px;
    font-weight: 600;
    margin: 0 0 15px 0;
    color: #fff;
    line-height: 1.3;
}

.article-summary {
    font-size: 15px;
    color: #cfcfcf;
    margin-bottom: 25px;
    flex-grow: 1;
}

.read-more {
    font-size: 14px;
    font-weight: 700;
    color: #7dd3fc;
}

/* 5. FOOTER */
footer {
    text-align: center;
    padding: 40px 20px;
    font-size: 14px;
    color: #777;
    border-top: 1px solid #222;
    background: #0b0b0b;
    flex-shrink: 0;
}
