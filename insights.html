/* Essential: Flexbox body pushes footer to the bottom of the viewport */
html, body {
    height: 100%;
    margin: 0;
}

body {
    font-family: "Inter", "Noto Sans TC", sans-serif;
    background: #0b0b0b;
    color: #eaeaea;
    line-height: 1.7;
    display: flex;
    flex-direction: column;
}

nav {
    background: #111;
    padding: 18px 40px;
    border-bottom: 1px solid #222;
}

nav a {
    color: #eaeaea;
    text-decoration: none;
    margin-right: 24px;
    font-weight: 500;
    font-size: 15px;
}

nav a:hover {
    color: #7dd3fc;
}

.container {
    max-width: 1100px;
    margin: 0 auto;
    padding: 60px 20px;
    flex: 1 0 auto; /* This allows the container to grow and push the footer down */
}

h1 {
    font-size: 42px;
    font-weight: 700;
    margin-bottom: 40px;
    text-align: left;
}

.insights-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));

}

}

    background: #1c1c1c;
}
